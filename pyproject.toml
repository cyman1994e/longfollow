[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cyman1994e-longfollow"
version = "0.1.0"
description = "对内容做归一化与分片比对，找出模型的长指令遵循上的重复项并按相似度归并"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "cyman1994e" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://cyman1994e.github.io"
Repository = "https://github.com/cyman1994e/longfollow"
Issues = "https://github.com/cyman1994e/longfollow/issues"

[project.scripts]
longfollow = "longfollow:main"

[tool.setuptools]
py-modules = ["longfollow"]
